<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>💭 碎碎念 · 我们的小窝</title>
<style>
:root {
  --primary: #FFD699;
  --primary-light: #FFE8C2;
  --primary-dark: #E8B86D;
  --primary-bg: #FFF5E6;
  --secondary: #FFC97A;
  --bg: #FFFBF0;
  --card-bg: #fff;
  --text: #5A4A3A;
  --text-light: #C0A888;
  --text-light2: #D0B898;
  --border: #F5E6D0;
  --border2: #EDE0C8;
  --shadow: rgba(255,214,153,0.3);
  --header-gradient: linear-gradient(135deg, #FFD699, #FFC97A);
  --btn-gradient: linear-gradient(135deg, #FFD699, #FFE8C2);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);max-width:600px;margin:0 auto;padding-bottom:80px;}
body.has-bg-img{background:var(--bg-img, none) center/cover fixed no-repeat, var(--bg);}
body.has-bg-img .post,body.has-bg-img .post-form,body.has-bg-img .setup-card,body.has-bg-img .settings-card{background:rgba(255,255,255,0.93);}
.settings-card{background:var(--card-bg,#fff);margin:12px 12px 0;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;padding:20px;}
.overlay.show{display:flex;}
.setup-card{background:var(--card-bg);border-radius:20px;padding:30px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:slideUp 0.35s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.setup-card h2{font-size:20px;margin-bottom:4px;}
.setup-card .sub{color:var(--text-light);font-size:13px;margin-bottom:18px;}
.setup-card label{display:block;text-align:left;font-size:13px;font-weight:600;color:#666;margin-bottom:6px;margin-top:14px;}
.setup-card input[type=text]{width:100%;border:2px solid var(--border);border-radius:14px;padding:12px 16px;font-size:15px;outline:none;transition:border 0.2s;font-family:inherit;}
.setup-card input[type=text]:focus{border-color:var(--primary);}
.avatar-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px;}
.avatar-opt{width:44px;height:44px;border-radius:50%;border:3px solid transparent;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#f5f5f5;transition:all 0.2s;}
.avatar-opt:hover{background:#eee;transform:scale(1.1);}
.avatar-opt.selected{border-color:var(--primary);background:var(--primary-bg);transform:scale(1.15);}
.color-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px;}
.color-opt{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all 0.2s;}
.color-opt:hover{transform:scale(1.15);}
.color-opt.selected{border-color:#333;transform:scale(1.2);box-shadow:0 0 0 2px #fff,0 0 0 4px #333;}
.setup-btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;margin-top:20px;transition:opacity 0.2s;background:linear-gradient(135deg,var(--primary),var(--secondary));}
.setup-btn:active{opacity:0.8;}
.header{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:14px 20px 12px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(124,77,255,0.3);}
.header-top{display:flex;justify-content:space-between;align-items:center;}
.header-top h1{font-size:18px;font-weight:600;}
.header-top .me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer;transition:background 0.2s;border:none;color:#fff;font-size:13px;}
.header-top .me:active{background:rgba(255,255,255,0.25);}
.header-top .me .mini-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.header small{font-size:12px;font-weight:400;opacity:0.7;display:block;margin-top:2px;}
.post-form{background:#fff;margin:12px;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.post-form textarea{width:100%;border:none;resize:none;font-size:15px;min-height:50px;outline:none;font-family:inherit;line-height:1.6;color:#333;padding:4px 0;}
.post-form textarea::placeholder{color:#bbb;}
.post-form .tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;border-top:1px dashed #E8D8D8;}
.post-form .mood-select{border:1px dashed #E8D8D8;border-radius:18px;padding:6px 14px;font-size:13px;outline:none;color:#666;background:#fafafa;}
.post-form .btn{border:none;border-radius:20px;padding:9px 28px;font-size:14px;cursor:pointer;transition:opacity 0.2s;color:#fff;}
.post-form .btn:disabled{opacity:0.5;}
.post-form .btn:active{opacity:0.8;}
.post{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.post .post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.post .post-author{display:flex;align-items:center;gap:8px;}
.post .post-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;}
.post .post-name{font-size:14px;font-weight:600;}
.post .post-time{font-size:12px;color:#aaa;}
.post .post-text{font-size:15px;line-height:1.7;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;}
.post .post-mood{display:inline-block;font-size:12px;padding:2px 10px;border-radius:12px;margin-bottom:6px;}
.post .post-actions{display:flex;gap:24px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border2);font-size:13px;color:#999;}
.post .post-actions span{cursor:pointer;display:flex;align-items:center;gap:4px;}
.post .post-actions span:hover{color:var(--primary);}
.post .post-actions .delete{color:#bbb;margin-left:auto;}
.post .post-actions .delete:hover{color:#ff4444;}
.comments{margin-top:10px;padding:10px 0 0;border-top:1px dashed var(--border2);}
.comment{font-size:14px;padding:6px 0;color:#555;line-height:1.5;}
.comment .comment-author{font-weight:600;margin-right:6px;display:inline-flex;align-items:center;gap:4px;}
.comment .cmt-avatar{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden;flex-shrink:0;}
.comment .comment-time{font-size:11px;color:#ccc;margin-left:6px;}
.comment-form{display:flex;gap:8px;margin-top:8px;align-items:center;}
.comment-form input{flex:1;border:1px dashed #E8D8D8;border-radius:18px;padding:8px 14px;font-size:13px;outline:none;transition:border 0.2s;}
.comment-form input:focus{border-color:var(--primary);}
.comment-form button{background:none;border:none;font-size:13px;font-weight:600;cursor:pointer;padding:6px 10px;}
.comment-form button:active{opacity:0.6;}
.empty{text-align:center;color:#ccc;padding:80px 20px;font-size:14px;line-height:2;}
.empty .big{font-size:48px;margin-bottom:10px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;animation:fadeIn 0.3s;}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

.nav-tabs{display:flex;gap:0;margin-top:8px;background:rgba(255,255,255,0.1);border-radius:14px;padding:3px;}
.nav-tabs .tab{flex:1;text-align:center;padding:6px 0;font-size:13px;border-radius:12px;cursor:pointer;color:rgba(255,255,255,.7);user-select:none;}
.nav-tabs .tab.active{color:var(--primary);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.page{display:none}.page.active{display:block}
.diary-form{background:#fff;margin:12px;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.diary-form input,.diary-form textarea{width:100%;border:2px dashed var(--border2);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;margin-bottom:8px;}
.diary-form textarea{min-height:120px;resize:vertical;}
.diary-card{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.diary-card .diary-date{font-size:12px;color:#999;}
.diary-card .diary-title{font-size:16px;font-weight:600;margin:4px 0 8px;}
.diary-card .diary-content{font-size:14px;line-height:1.7;color:#555;white-space:pre-wrap;}
.diary-card .diary-mood{display:inline-block;font-size:12px;padding:2px 10px;border-radius:12px;}
.diary-card .diary-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border2);}
.diary-card .diary-actions span{cursor:pointer;color:#999;}
.diary-card .diary-actions span:hover{color:#ff4444;}
.image-preview{position:relative;display:inline-block;margin:8px 0;border-radius:10px;overflow:hidden;max-width:100%;}
.image-preview img{max-height:150px;max-width:100%;border-radius:10px;display:block;border:1px solid #eee;}
.image-preview-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.5);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;}
.upload-btn{cursor:pointer;font-size:20px;padding:2px;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:background 0.2s;}
.upload-btn:hover{background:var(--primary-bg);}
.upload-btn:active{background:#e1bee7;}
.post-image{margin:8px 0;border-radius:10px;overflow:hidden;max-width:100%;cursor:pointer;}
.post-image img{max-width:100%;max-height:300px;border-radius:10px;display:block;border:1px solid #eee;}
.diary-image{margin:8px 0;border-radius:10px;overflow:hidden;max-width:100%;}
.diary-image img{max-width:100%;max-height:300px;border-radius:10px;display:block;border:1px solid #eee;}
.agent-grid{display:flex;flex-wrap:wrap;gap:12px;padding:12px;}
.agent-card{background:#fff;border-radius:16px;padding:16px;flex:1;min-width:140px;box-shadow:0 1px 6px rgba(0,0,0,.06);text-align:center;cursor:pointer;}
.agent-card .agent-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px;}
.agent-card .agent-name{font-size:14px;font-weight:600;}
.chat-view{display:none;flex-direction:column;height:calc(100vh - 180px);}
.chat-view.show{display:flex;}
.chat-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f0f0;}
.chat-msg{display:flex;gap:8px;margin-bottom:16px;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-msg .msg-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;}
.chat-msg.agent .msg-bubble{background:#f0f0ff;border-bottom-left-radius:4px;}
.chat-msg.user .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
.chat-input-area{display:flex;gap:8px;padding:10px 16px;background:#fff;border-top:1px dashed var(--border2);}
.chat-input-area input{flex:1;border:2px dashed var(--border2);border-radius:20px;padding:10px 16px;font-size:14px;outline:none;}
.chat-input-area button{border:none;border-radius:20px;padding:10px 20px;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-light));height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;}
.add-agent-btn{display:block;margin:12px;padding:12px;border:2px dashed #ddd;border-radius:14px;color:#999;font-size:14px;cursor:pointer;text-align:center;}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;}
.modal.show{display:flex;justify-content:center;align-items:center;padding:20px;}
.modal-card{background:#fff;border-radius:20px;padding:24px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-card h3{font-size:18px;}
.modal-card label{display:block;text-align:left;font-size:13px;font-weight:600;color:#666;margin-bottom:4px;margin-top:12px;}
.modal-card input,.modal-card textarea{width:100%;border:2px dashed var(--border2);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;}
.modal-card textarea{min-height:80px;}
.modal-card .modal-actions{display:flex;gap:12px;margin-top:16px;}
.modal-card .modal-actions button{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;}
.modal-card .btn-cancel{background:#f5f5f5;color:#666;}
.modal-card .btn-confirm{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;}
.empty-state{text-align:center;color:#ccc;padding:60px 20px;}
.friend-search{margin:12px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.friend-search input{width:100%;border:2px dashed var(--border2);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;}
.friend-search input:focus{border-color:var(--primary);}
.search-result-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border2);}
.search-result-item:last-child{border-bottom:none;}
.search-result-item .mini-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;flex-shrink:0;}
.search-result-item .name{flex:1;font-size:14px;font-weight:600;}
.search-result-item .btn-sm{border:none;border-radius:16px;padding:6px 16px;font-size:12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-light));flex-shrink:0;}
.search-result-item .btn-sm:disabled{opacity:.5;}
.friend-section{margin:12px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.friend-section .section-title{font-size:13px;font-weight:600;color:#666;margin-bottom:10px;}
.friend-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;cursor:pointer;}
.friend-item:last-child{border-bottom:none;}
.friend-item:active{background:#fafafa;margin:-10px -14px;padding:10px 14px;border-radius:10px;}
.friend-item .mini-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;flex-shrink:0;}
.friend-item .name{flex:1;font-size:14px;font-weight:600;}
.friend-item .badge{font-size:11px;color:#999;}
.friend-chat-view{display:none;flex-direction:column;height:calc(100vh - 160px);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:#f5f5f5;z-index:200;animation:slideUp 0.3s ease;}
.friend-chat-view.show{display:flex;}
.friend-chat-view .chat-messages{flex:1;overflow-y:auto;padding:12px 16px;}
.friend-chat-view .chat-msg{flex-direction:column;align-items:flex-start;gap:2px;}
.friend-chat-view .chat-msg.user{flex-direction:column;align-items:flex-end;justify-content:flex-start;}
.friend-chat-view .chat-msg .msg-time{font-size:10px;color:#bbb;margin-top:2px;}
.friend-chat-view .chat-msg.user .msg-time{text-align:right;}
.friend-chat-view.fullscreen{max-width:100%;height:100vh;bottom:0;z-index:300;}
.fullscreen-btn{margin-left:auto;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background 0.2s;}
.request-actions{display:flex;gap:8px;margin-left:auto;}
/* loading动画 */
.loading-dots{display:flex;align-items:center;justify-content:center;gap:6px;padding:30px 0;}
.loading-dots span{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:dotBounce 1.4s ease-in-out infinite;}
.loading-dots span:nth-child(2){animation-delay:0.2s;}
.loading-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dotBounce{0%,80%,100%{transform:scale(0);opacity:0.3;}40%{transform:scale(1);opacity:1;}}
.request-actions button{border:none;border-radius:14px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:600;}
.request-actions .accept{background:#e8f5e9;color:#2e7d32;}
.request-actions .reject{background:#fff0f0;color:#c62828;}

/* ====== 响应式：平板端适配（≥768px） ====== */
@media (min-width:768px){
  body{max-width:800px;}
  .friend-chat-view{max-width:800px;}
  .post-form,.post,.diary-form,.diary-card{margin:14px 16px;}
  .setup-card{max-width:450px;padding:36px 28px;}
  .modal-card{max-width:450px;padding:28px;}
}

/* ====== 响应式：PC端适配（≥1024px） ====== */
@media (min-width:1024px){
  body{max-width:1100px;padding-bottom:20px;}
  .friend-chat-view{max-width:1100px;}
  .header{padding:18px 28px 14px;}
  .header-top h1{font-size:22px;}
  .nav-tabs .tab{font-size:15px;padding:10px 6px;}
  /* 帖子 → 双列网格 */
  #postsContainer{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px;}
  .post{margin:0;}
  /* 日记 → 双列网格 */
  #diariesContainer{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px;}
  .diary-card{margin:0;}
  /* 弹窗更大 */
  .setup-card{max-width:560px;padding:44px 36px;}
  .modal-card{max-width:560px;padding:32px;}
  /* 发帖区更舒适 */
  .post-form,.diary-form{padding:20px;}
  .post-form textarea{min-height:70px;font-size:16px;}
  /* 图片更大 */
  .post-image img{max-height:400px;}
  /* 智能体网格 → 更多列 */
  .agent-card{min-width:200px;padding:24px 20px;}
  .agent-card .agent-avatar{width:56px;height:56px;font-size:24px;}
  .agent-card .agent-name{font-size:16px;}
  .agent-grid{gap:16px;padding:16px;}
  .chat-view{height:calc(100vh - 200px);}

  /* ====== 设置页面：宽屏大改造 ====== */
  #page-settings .setup-card{max-width:920px;padding:44px 48px;}
  #page-settings .setup-card > div:first-child{margin-bottom:24px;}
  #page-settings #settingsAvatar.mini-avatar{width:80px !important;height:80px !important;font-size:36px !important;}
  #page-settings #settingsName{font-size:22px !important;}
  #page-settings .color-grid{gap:14px;}
  #page-settings .color-opt{width:44px;height:44px;}
  /* 设置页面：用flex两栏布局 */
  #page-settings .settings-two-col{display:flex;gap:32px;flex-wrap:wrap;}
  #page-settings .settings-two-col > div{flex:1;min-width:260px;}

  /* ====== 好友页面：宽屏优化 ====== */
  #friendsList{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .friend-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:0;}
  .friend-item:active{background:var(--primary-bg);}
  .friend-search{padding:18px 20px;}
  .friend-search input{font-size:15px;padding:12px 16px;}

  /* ====== 智能体页面：更多优化 ====== */
  .add-agent-btn{margin:16px;padding:16px;font-size:15px;}

  /* ====== 登录/注册弹窗 ====== */
  #authOverlay .setup-card{padding:36px 40px;}
  #authOverlay .avatar-opt{width:48px;height:48px;font-size:24px;}
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
</style>
</head>
<body>

<!-- 登录/注册弹窗 -->
<div class="overlay" id="authOverlay" onclick="if(event.target===this)closeAuth()">
  <div class="setup-card" style="position:relative;">
    <span onclick="closeAuth()" style="position:absolute;top:14px;right:16px;width:28px;height:28px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:#999;line-height:1;transition:all .2s;hover:background:#e0e0e0;" onmouseover="this.style.background='#e0e0e0'" onmouseout="this.style.background='#f0f0f0'">✕</span>
    <h2>✧ 欢迎来到碎碎念</h2>
    <p class="sub">登录或注册，开启你的小窝</p>
    <div class="auth-tabs" style="display:flex;gap:0;margin-bottom:18px;background:#f5f5f5;border-radius:12px;padding:3px;">
      <span class="atab active" onclick="switchAuthTab('login')" style="flex:1;text-align:center;padding:8px 0;font-size:14px;border-radius:10px;cursor:pointer;color:#999;transition:all .2s;" id="tabLogin">登录</span>
      <span class="atab" onclick="switchAuthTab('register')" style="flex:1;text-align:center;padding:8px 0;font-size:14px;border-radius:10px;cursor:pointer;color:#999;transition:all .2s;" id="tabReg">注册</span>

<script>
const AVATARS = ['🌸','💜','🌟','🦋','🌙','🍀','🎀','🌈','💫','🧸','🌺','🐱','🦊','🐼','⭐','🌷'];
const COLORS = ['#FFD699','#FFC97A','#FFB88C','#FFD4A8','#FFE8C2','#F5D6A0','#E8C89A','#D4B896','#FFE0B2','#FFCC80','#FFAB91','#BCAAA4'];

// 统一头像渲染：支持 emoji / 图片 URL / base64 data URL
function avatarHtml(v){
  if(v&&(v.startsWith('/uploads/')||v.startsWith('http')||v.startsWith('data:')))
    return '<img src="'+v+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
  return v||'🌸';
}

// ====== 认证系统 ======
let token = localStorage.getItem('suisui_token') || '';
let user = (()=>{try{const r=localStorage.getItem('suisui_user');return r?JSON.parse(r):null}catch(e){return null}})();
let isPrivate = false;
let diaryIsPrivate = true;
// ★★ 帖子可见性：public=公开 / private=仅自己 / custom=仅指定的人 ★★
let postVisible = 'public';
let postVisibleTo = [];        // 指定可见的用户ID数组
let postVisibleToNames = [];   // 指定可见的用户名（用于显示）

function saveAuth(){localStorage.setItem('suisui_token',token);localStorage.setItem('suisui_user',JSON.stringify(user||{}));}
function closeAuth(){document.getElementById('authOverlay').classList.remove('show');}
function clearAuth(){token='';user=null;localStorage.removeItem('suisui_token');localStorage.removeItem('suisui_user');}

// 统一请求头（带Token）
function authHeaders(){const h={'Content-Type':'application/json'};if(token)h['Authorization']='Bearer '+token;return h;}

// ====== 登录/注册切换 ======
function switchAuthTab(tab){
  document.getElementById('tabLogin').classList.toggle('active',tab==='login');
  document.getElementById('tabReg').classList.toggle('active',tab==='register');

// 注册
async function doRegister(){
  const u=document.getElementById('regUsername').value.trim();
  const p=document.getElementById('regPassword').value;
  const p2=document.getElementById('regPassword2').value;
  const errEl=document.getElementById('regError');
  if(!u||!p)return showError(errEl,'请填写完整');
  if(p!==p2)return showError(errEl,'两次密码不一致');
  if(u.length<2)return showError(errEl,'用户名至少2个字符');
  try{
    const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await res.json();
    if(d.error)return showError(errEl,d.error);
    // 注册成功自动登录
    token=d.token;user={id:d.id,name:u,avatar:'🌸',color:'#7C4DFF',is_admin:d.is_admin||0};saveAuth();
    document.getElementById('authOverlay').classList.remove('show');updateUI();loadPosts();toast('注册成功！欢迎 '+u+' ♡');
  }catch(e){showError(errEl,'网络错误，请重试')}
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'"',"'":'&#39;'}[c];});
}

// ====== 主题背景图上传（压缩后存 base64） ======
window.pendingThemeBg = '';

document.getElementById('themeBgUpload').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var status = document.getElementById('themeBgStatus');
  var wrap = document.getElementById('themeBgPreviewWrap');
  var clearBtn = document.getElementById('themeBgClearBtn');
  status.textContent = '⏳ 压缩中...';
  status.style.color = '#999';
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var MAX = 1600;
      var w = img.width, h = img.height;
      if(w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
      if(h > MAX){ w = Math.round(w * MAX / h); h = MAX; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      window.pendingThemeBg = dataUrl;
      wrap.style.backgroundImage = 'url(' + dataUrl + ')';
      wrap.style.display = 'block';
      clearBtn.style.display = '';
      status.textContent = '✅ 已选好，点「✨ 应用主题」生效';
      status.style.color = '#4CAF50';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('themeBgClearBtn').addEventListener('click', function(){
  window.pendingThemeBg = '';
  document.getElementById('themeBgUpload').value = '';
  document.getElementById('themeBgPreviewWrap').style.display = 'none';
  document.getElementById('themeBgClearBtn').style.display = 'none';
  var st = document.getElementById('themeBgStatus');
  st.textContent = '已移除，点「✨ 应用主题」生效';
  st.style.color = '#999';
});

  if(btn)btn.style.background='linear-gradient(135deg,'+user.color+','+lighten(user.color,40)+')';
}

function lighten(h,a){
  let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return '#'+[r,g,b].map(c=>Math.min(255,c+a).toString(16).padStart(2,'0')).join('');
}

// 帖子
async function loadPosts(){
  try{
    const res=await fetch('/api/posts',{headers:authHeaders()});
    const posts=await res.json();
    const c=document.getElementById('postsContainer');
    if(!posts.length){c.innerHTML='<div class="empty"><div class="big">💭</div>'+(token?'还没有碎碎念哦～<br>写一条开始吧 💜':'还没有公开的碎碎念哦～<br><span style="font-size:13px;color:#bbb;">登录后可以发帖和大家互动 ✨</span>')+'</div>';return;}
    c.innerHTML=posts.map(p=>{
      const a=p.avatar||(p.author==='沈郁'?'💜':'🌸');
      const co=p.color||(p.author==='沈郁'?'#7C4DFF':'#FF6B9D');
      const isMe=user&&p.author===user.name;
      if(p.visible==='private'&&!isMe) return '';
      const na=isMe?user.name:p.author;
      const av=isMe&&user.avatar?user.avatar:a;
      const cl=isMe&&user.color?user.color:co;
      return `<div class="post" data-id="${p.id}">
        <div class="post-header">
          <div class="post-author">
            <div class="post-avatar" style="background:${cl}">${avatarHtml(av)}</div>
             <div><div class="post-name" style="color:${cl}">${na}</div></div>
          </div>
          <span class="post-time">${p.time}</span>
        </div>
        <div class="post-text">${p.text}</div>
        ${p.image?`<div class="post-image" onclick="window.open(this.querySelector('img').src)"><img src="${p.image}" alt="帖子图片" loading="lazy"></div>`:''}
        ${p.audio?(function(){
        let aud=null,dur=0;
        try{aud=JSON.parse(p.audio);dur=aud.dur||0;}catch(e){aud={url:p.audio};}
        return `<div class="post-audio" style="display:flex;align-items:center;gap:10px;padding:8px 0;">
          <span onclick="playAudio(this,'${aud.url.replace(/'/g,"\\'")}')" style="cursor:pointer;width:34px;height:34px;border-radius:50%;background:${cl};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">▶</span>
          <div style="flex:1;min-width:0;"><div style="height:4px;background:#eee;border-radius:2px;overflow:hidden;"><div class="audio-progress" style="height:100%;width:0;background:${cl};border-radius:2px;transition:width 0.3s;"></div></div></div>
          <span style="font-size:12px;color:#999;white-space:nowrap;">${dur?dur+'″':''}</span>
        </div>`;

let mediaRecorder=null,audioChunks=[],recordStartTime=0;
async function toggleRecord(){
  const btn=document.getElementById('recordBtn');
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    // 停止录音
    mediaRecorder.stop();
    const dur=Math.round((Date.now()-recordStartTime)/1000);
    window.pendingAudioDuration=dur||1;
    btn.textContent='🎤';btn.style.background='#fafafa';btn.style.color='';
    btn.style.animation='';
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});
    audioChunks=[];
    recordStartTime=Date.now();
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=()=>{
        window.pendingAudio=reader.result;
        const d=window.pendingAudioDuration||1;
        document.getElementById('audioPreview').style.display='inline-flex';
        document.getElementById('audioName').textContent='语音 '+d+'秒 ('+Math.round(blob.size/1024)+'KB)';
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    btn.textContent='🔴';btn.style.background='#fff0f0';btn.style.borderColor='#ff4444';
    btn.style.animation='pulse 1s infinite';
    toast('正在录音...再次点击停止');
  }catch(e){
    toast('无法访问麦克风💔 请检查浏览器权限');
    console.error(e);
  }
}
function clearAudio(){
  window.pendingAudio=null;
  window.pendingAudioDuration=0;
  document.getElementById('audioPreview').style.display='none';
  if(mediaRecorder){mediaRecorder=null;audioChunks=[];}
  document.getElementById('recordBtn').textContent='🎤';
  document.getElementById('recordBtn').style.background='#fafafa';
  document.getElementById('recordBtn').style.borderColor='#e0e0e0';
  document.getElementById('recordBtn').style.animation='';
}

// 播放语音（自定义播放器）
let currentAudio=null,currentAudioBtn=null;
function playAudio(btn,url){
  if(currentAudio&&currentAudioBtn===btn){
    if(currentAudio.paused){currentAudio.play();btn.textContent='⏸';}
    else{currentAudio.pause();btn.textContent='▶';}
    return;
  }
  if(currentAudio){currentAudio.pause();if(currentAudioBtn)currentAudioBtn.textContent='▶';}
  currentAudio=new Audio(url);
  currentAudioBtn=btn;
  btn.textContent='⏸';
  currentAudio.onended=()=>{btn.textContent='▶';currentAudio=null;currentAudioBtn=null;};
  const bar=btn.parentElement.querySelector('.audio-progress');
  if(bar){currentAudio.ontimeupdate=()=>{if(currentAudio.duration)bar.style.width=(currentAudio.currentTime/currentAudio.duration*100)+'%';};}
  currentAudio.onerror=()=>{btn.textContent='⚠';currentAudio=null;currentAudioBtn=null;};
  currentAudio.play();
}

function closeAgentModal(){document.getElementById('agentModal').classList.remove('show');}

function pickAgentAvatar(el){
  document.querySelectorAll('#agentAvatarGrid .avatar-opt').forEach(function(e){e.classList.remove('selected')});
  el.classList.add('selected');
}
function pickAgentColor(el){
  document.querySelectorAll('#agentColorGrid .color-opt').forEach(function(e){e.classList.remove('selected')});
  el.classList.add('selected');
}

var uploadedAgentAvatar = null;

document.getElementById('agentAvatarUpload').addEventListener('change', async function(e){
  var file = e.target.files[0];
  if(!file) return;
  var btn = document.getElementById('agentUploadBtn');
  var status = document.getElementById('agentAvatarStatus');
  var preview = document.getElementById('agentAvatarPreview');
  btn.disabled = true;
  status.textContent = '⏳ 上传中...';
  var fd = new FormData();
  fd.append('file', file);
  try{
    var res = await fetch('/api/upload', {method:'POST', headers:{'Authorization':'Bearer '+token}, body:fd});
    var data = await res.json();
    if(data.url){
      uploadedAgentAvatar = data.url;
      preview.src = data.url;
      preview.style.display = 'block';
      status.textContent = '✅ 已上传自定义头像';
      status.style.color = '#4CAF50';
      document.querySelectorAll('#agentAvatarGrid .avatar-opt').forEach(function(el){el.classList.remove('selected')});
    }else{
      status.textContent = '❌ 上传失败: '+(data.error||'未知错误');
      status.style.color = '#f44336';

    status.textContent = '❌ 上传失败: '+err.message;

});

async function saveAgent(){
  if(!token){document.getElementById('authOverlay').classList.add('show');return toast('请先登录')}
  var n=document.getElementById('agentNameInput').value.trim()||'新智能体';

  var p=document.getElementById('agentPromptInput').value.trim()||'你是一个温柔可爱的助手。';
  await fetch('/api/agents',{method:'POST',headers:authHeaders(),body:JSON.stringify({name:n,avatar:a,color:c,prompt:p})});
  closeAgentModal();
  toast('智能体 '+n+' 已创建');
  loadAgents();
}

function openChat(id,name,color){
  currentAgentId=id;
  chatHistory=[];
  document.getElementById('chatName').textContent=name;
  document.getElementById('chatName').style.color=color;
  document.getElementById('chatMessages').innerHTML='';
  document.querySelector('.agent-grid').style.display='none';
  document.querySelector('.add-agent-btn').style.display='none';
  document.getElementById('chatView').classList.add('show');
  document.getElementById('chatInput').focus();
  // 从后端加载历史聊天记录
  fetch('/api/agents/'+id+'/messages',{headers:authHeaders()}).then(function(r){return r.json()}).then(function(msgs){
    if(msgs && msgs.length){
      var el=document.getElementById('chatMessages');
      msgs.forEach(function(m){
        chatHistory.push({role:m.role,content:m.content});
        if(m.role==='user'){
          el.innerHTML+='<div class="chat-msg user"><div class="msg-bubble">'+m.content+'</div></div>';
        }else if(m.role==='assistant'){
          el.innerHTML+='<div class="chat-msg agent"><div class="msg-bubble">'+m.content+'</div></div>';
        }
      });
      el.scrollTop=el.scrollHeight;
    }
  }).catch(function(){});
}

function closeChat(){
  currentAgentId=null;
  clearChatFile();
  document.getElementById('chatView').classList.remove('show');
  document.querySelector('.agent-grid').style.display='flex';
  document.querySelector('.add-agent-btn').style.display='block';
}

async function sendChat(){
  var inp=document.getElementById('chatInput');
  var txt=inp.value.trim();
  if(!txt&&!pendingChatFile) return;
  if(!currentAgentId) return;
  inp.value='';
  var btn=document.getElementById('chatSendBtn');btn.disabled=true;
  // 如果有附加文件，把内容拼到消息里
  var fullTxt=txt;
  var fileName=null;
  if(pendingChatFile){
    fileName=pendingChatFile.name;
    fullTxt+=(txt?'\n\n':'')+'📎 文件：'+pendingChatFile.name+'\n```\n'+pendingChatFile.content+'\n```';
    clearChatFile();
  }
  chatHistory.push({role:'user',content:fullTxt});
  var msgs=document.getElementById('chatMessages');
  msgs.innerHTML+='<div class="chat-msg user"><div class="msg-bubble">'+(txt||'📎 '+fileName)+'</div></div>';
  msgs.scrollTop=msgs.scrollHeight;
  try{
    var res=await fetch('/api/agents/'+currentAgentId+'/chat',{method:'POST',headers:authHeaders(),body:JSON.stringify({messages:chatHistory.slice(-10)})});
    var data=await res.json();
    if(data.reply){
      chatHistory.push({role:'assistant',content:data.reply});
      msgs.innerHTML+='<div class="chat-msg agent"><div class="msg-bubble">'+data.reply+'</div></div>';
    }else{
      msgs.innerHTML+='<div class="chat-msg agent"><div class="msg-bubble" style="background:#fff0f0;color:#c00">'+(data.error||'对话失败')+'</div></div>';
    }
  }catch(e){
    msgs.innerHTML+='<div class="chat-msg agent"><div class="msg-bubble" style="background:#fff0f0;color:#c00">网络错误</div></div>';
  }
  msgs.scrollTop=msgs.scrollHeight;
  btn.disabled=false;
}

// ====== 好友与私信系统 ======
let currentFriendId = null;
let searchTimer = null;
let friendPollTimer = null;
let lastMsgCount = 0;

// 格式化时间（自动转换到本地时区）
function fmtTime(t){
  try{
    var d=new Date(t);
    if(isNaN(d.getTime())) return '';
    // 用toLocaleString自动处理时区转换
    return d.toLocaleString('zh-CN', {hour:'2-digit', minute:'2-digit', hour12:false});
  }catch(e){return '';}
}

// loading动画HTML
function loadingDots(){return '<div class="loading-dots"><span></span><span></span><span></span></div>';}

// HTML转义
function escHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'"');
}

function searchUsers(){
  var q=document.getElementById('friendSearchInput').value.trim();
  var el=document.getElementById('friendSearchResults');
  if(!q){el.innerHTML='';return;}
  clearTimeout(searchTimer);
  el.innerHTML='<div style="padding:10px 0;color:#999;font-size:13px;">🔍 搜索中…</div>';
  searchTimer=setTimeout(async function(){
    try{
      var res=await fetch('/api/users/search?q='+encodeURIComponent(q),{headers:authHeaders()});
      var data=await res.json();
      if(!data || !data.length){el.innerHTML='<div style="padding:10px 0;color:#999;font-size:13px;">没有找到用户</div>';return;}
      var html='';
      for(var i=0;i<data.length;i++){
        var u=data[i];
        html+='<div class="search-result-item">'+
          '<div class="mini-avatar" style="background:'+u.color+'">'+avatarHtml(u.avatar)+'</div>'+
          '<span class="name">'+u.nickname+'</span>'+
          '<button class="btn-sm" id="freq_'+u.id+'" onclick="sendFriendRequest('+u.id+',this)">➕ 加好友</button>'+
        '</div>';
      }
      el.innerHTML=html;
    }catch(e){el.innerHTML='<div style="padding:10px 0;color:#c00;font-size:13px;">搜索失败</div>';}
  },350);
}

async function sendFriendRequest(friendId,btn){
  if(btn){btn.disabled=true;btn.textContent='⏳ 发送中…';}
  try{
    var res=await fetch('/api/friends/request',{method:'POST',headers:authHeaders(),body:JSON.stringify({friend_id:friendId})});
    var data=await res.json();
    if(data.ok){toast('✨ '+data.message);if(btn)btn.textContent='✅ 已发送';loadFriendRequests();}
    else{if(btn)btn.textContent='➕ 加好友';toast(data.error||'请求失败');}
  }catch(e){if(btn)btn.textContent='➕ 加好友';toast('网络错误');}
  if(btn) setTimeout(function(){btn.disabled=false;},2000);
}

async function loadFriends(){
  var el=document.getElementById('friendsList');
  if(!el) return;
  el.innerHTML=loadingDots();
  try{
    var res=await fetch('/api/friends',{headers:authHeaders()});
    var data=await res.json();
    if(!data || !data.length){
      el.innerHTML='<div class="empty-state" style="padding:40px 20px;">还没有好友～去搜索添加吧！🔍</div>';
      return;
    }
    var html='';
    for(var i=0;i<data.length;i++){
      var f=data[i];
      html+='<div class="friend-item" onclick="openFriendChat('+f.id+',\''+f.nickname.replace(/'/g,"\\'")+'\')">'+
        '<div class="mini-avatar" style="background:'+f.color+'">'+avatarHtml(f.avatar)+'</div>'+
        '<span class="name">'+f.nickname+'</span>'+
        '<span class="badge">💬 发消息</span>'+
      '</div>';
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div style="padding:20px;color:#c00;">加载好友列表失败</div>';}
}

async function loadFriendRequests(){
  var el=document.getElementById('friendRequestsSection');
  if(!el) return;
  el.innerHTML=loadingDots();
  try{
    var res=await fetch('/api/friends/requests',{headers:authHeaders()});
    var data=await res.json();
    var html='';
    if(data.incoming && data.incoming.length){
      html+='<div class="friend-section"><div class="section-title">📩 好友请求</div>';
      for(var i=0;i<data.incoming.length;i++){
        var r=data.incoming[i];
        html+='<div class="search-result-item">'+
          '<div class="mini-avatar" style="background:'+r.color+'">'+avatarHtml(r.avatar)+'</div>'+
          '<span class="name">'+r.nickname+'</span>'+
          '<div class="request-actions">'+
            '<button class="accept" onclick="respondRequest('+r.id+',\'accept\',this)">✓ 接受</button>'+
            '<button class="reject" onclick="respondRequest('+r.id+',\'reject\',this)">✕ 拒绝</button>'+
          '</div></div>';
      }
      html+='</div>';
    }
    if(data.outgoing && data.outgoing.length){
      html+='<div class="friend-section"><div class="section-title">⏳ 等待对方确认</div>';
      for(var i=0;i<data.outgoing.length;i++){
        var r=data.outgoing[i];
        html+='<div class="search-result-item">'+
          '<div class="mini-avatar" style="background:'+r.color+'">'+avatarHtml(r.avatar)+'</div>'+
          '<span class="name">'+r.nickname+'</span>'+
          '<span style="font-size:12px;color:#999;margin-left:auto;">等待中…</span>'+
        '</div>';
      }
      html+='</div>';
    }
    if(!html) html='<div class="friend-section" style="display:none;"></div>';
    el.innerHTML=html;
  }catch(e){el.innerHTML='';}
}

async function respondRequest(requestId,action,btn){
  btn.disabled=true;
  btn.textContent=action==='accept'?'⏳ 接受中…':'⏳ 拒绝中…';
  try{
    var res=await fetch('/api/friends/respond',{method:'POST',headers:authHeaders(),body:JSON.stringify({request_id:requestId,action:action})});
    var data=await res.json();
    if(data.ok){toast('✨ '+data.message);loadFriendRequests();loadFriends();}
    else{btn.disabled=false;btn.textContent=action==='accept'?'✓ 接受':'✕ 拒绝';toast(data.error||'操作失败');}
  }catch(e){btn.disabled=false;btn.textContent=action==='accept'?'✓ 接受':'✕ 拒绝';toast('网络错误');}
}

function openFriendChat(friendId,name){
  currentFriendId=friendId;
  lastMsgCount=0;
  document.getElementById('friendChatName').textContent='💬 '+name;
  document.getElementById('friendChatMessages').innerHTML=loadingDots();
  document.getElementById('friendChatView').classList.add('show');
  loadFriendMessages(friendId);
  // 启动轮询：每4秒检查新消息
  clearInterval(friendPollTimer);
  friendPollTimer=setInterval(function(){
    if(currentFriendId) loadFriendMessages(currentFriendId, true);
  },4000);
}

function toggleFriendChatFullscreen(){
  var box=document.getElementById('friendChatView');
  box.classList.toggle('fullscreen');
}
function closeFriendChat(){
  currentFriendId=null;
  clearInterval(friendPollTimer);
  friendPollTimer=null;
  document.getElementById('friendChatView').classList.remove('show');
}

async function loadFriendMessages(friendId, isPoll){
  var el=document.getElementById('friendChatMessages');
  try{
    var res=await fetch('/api/messages/'+friendId,{headers:authHeaders()});
    var data=await res.json();
    if(data && data.length){
      // 轮询模式：如果消息数量没变就不重新渲染
      if(isPoll && data.length===lastMsgCount) return;
      lastMsgCount=data.length;
      var html='';
      for(var i=0;i<data.length;i++){
        var m=data[i];
        var isMe=(m.from_user_id===user.id);
        var cls=isMe?'user':'friend';
        html+='<div class="chat-msg '+cls+'">'+
          '<div class="msg-bubble">'+escHtml(m.content)+'</div>'+
          '<div class="msg-time">'+fmtTime(m.created_at)+'</div>'+
        '</div>';
      }
      el.innerHTML=html;
      el.scrollTop=el.scrollHeight;
    }else{
      lastMsgCount=0;
      el.innerHTML='<div style="text-align:center;color:#ccc;padding:40px;">开始聊天吧～💬</div>';
    }
  }catch(e){
    if(!isPoll) el.innerHTML='<div style="text-align:center;color:#c00;padding:20px;">加载消息失败</div>';
  }
}

async function sendFriendMessage(){
  var inp=document.getElementById('friendChatInput');
  var txt=inp.value.trim();
  if(!txt || !currentFriendId) return;
  inp.value='';
  // 乐观显示消息
  var el=document.getElementById('friendChatMessages');
  var emptyEl=el.querySelector('div[style*="text-align:center"]');
  if(emptyEl) el.innerHTML='';
  el.innerHTML+='<div class="chat-msg user"><div class="msg-bubble">'+escHtml(txt)+'</div><div class="msg-time">'+fmtTime(new Date())+'</div></div>';
  el.scrollTop=el.scrollHeight;
  try{
    var res=await fetch('/api/messages/send',{method:'POST',headers:authHeaders(),body:JSON.stringify({to_user_id:currentFriendId,content:txt})});
    var data=await res.json();
    if(data.ok){
      // 延迟重新加载，确保和服务器同步
      setTimeout(function(){if(currentFriendId) loadFriendMessages(currentFriendId, true);},500);
    }else{
      toast(data.error||'发送失败');
    }
  }catch(e){toast('网络错误');}
}

// ====== 自定义主题系统 ======

// 默认主题
const DEFAULT_THEME = {
  primary: '#FFD699',
  secondary: '#FFC97A',
  bg: '#FFFBF0',
  card_bg: '#ffffff',
  text: '#5A4A3A',
  text_light: '#C0A888'
};

// 应用主题到CSS变量
function applyTheme(theme){
  if(!theme) theme = DEFAULT_THEME;
  var root = document.documentElement;
  root.style.setProperty('--primary', theme.primary || DEFAULT_THEME.primary);
  root.style.setProperty('--secondary', theme.secondary || DEFAULT_THEME.secondary);
  root.style.setProperty('--primary-light', lightenColor(theme.primary || DEFAULT_THEME.primary, 40));
  root.style.setProperty('--primary-bg', lightenColor(theme.primary || DEFAULT_THEME.primary, 85));
  root.style.setProperty('--primary-dark', darkenColor(theme.primary || DEFAULT_THEME.primary, 20));
  root.style.setProperty('--bg', theme.bg || DEFAULT_THEME.bg);
  root.style.setProperty('--card-bg', theme.card_bg || DEFAULT_THEME.card_bg);
  root.style.setProperty('--text', theme.text || DEFAULT_THEME.text);
  root.style.setProperty('--text-light', theme.text_light || DEFAULT_THEME.text_light);
  // 更新渐变（依赖primary和secondary）
  root.style.setProperty('--header-gradient', 'linear-gradient(135deg, '+(theme.primary||DEFAULT_THEME.primary)+', '+(theme.secondary||DEFAULT_THEME.secondary)+')');
  root.style.setProperty('--btn-gradient', 'linear-gradient(135deg, '+(theme.primary||DEFAULT_THEME.primary)+', '+lightenColor(theme.primary||DEFAULT_THEME.primary, 40)+')');
  // 更新shadow
  root.style.setProperty('--shadow', hexToRgba(theme.primary||DEFAULT_THEME.primary, 0.3));
  // 背景图支持
  window.currentTheme = theme;
  var bgImg = theme.bg_image || '';
  if(bgImg){
    root.style.setProperty('--bg-img', 'url('+bgImg+')');
    document.body.classList.add('has-bg-img');
  }else{
    root.style.setProperty('--bg-img', 'none');
    document.body.classList.remove('has-bg-img');
  }
  // 同步到设置页的颜色选择器
  if(document.getElementById('themePrimary')){
    document.getElementById('themePrimary').value = theme.primary || DEFAULT_THEME.primary;
    document.getElementById('themeSecondary').value = theme.secondary || DEFAULT_THEME.secondary;
    document.getElementById('themeBg').value = theme.bg || DEFAULT_THEME.bg;
    document.getElementById('themeCardBg').value = theme.card_bg || DEFAULT_THEME.card_bg;
  }
}

// 把主题保存到后端
async function saveThemeToServer(theme){
  if(!token) return;
  try{
    await fetch('/api/profile', {method:'PUT', headers:authHeaders(), body:JSON.stringify({theme: theme})});
  }catch(e){}
}

// 加载用户主题
async function loadUserTheme(){
  if(!token) return;
  try{
    var res = await fetch('/api/profile', {headers:authHeaders()});
    var data = await res.json();
    if(data && data.theme){
      if(typeof data.theme === 'string'){
        try{ data.theme = JSON.parse(data.theme); }catch(e){ data.theme = null; }
      }
      if(data.theme && Object.keys(data.theme).length > 0){
        applyTheme(data.theme);
        return data.theme;
      }
    }
  }catch(e){}
  applyTheme(DEFAULT_THEME);
  return null;
}

// 颜色工具函数
function hexToRgba(hex, opacity){
  if(!hex) return 'rgba(124,77,255,'+(opacity||0.3)+')';
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(function(c){return c+c}).join('');
  var r = parseInt(hex.substring(0,2), 16);
  var g = parseInt(hex.substring(2,4), 16);
  var b = parseInt(hex.substring(4,6), 16);
  return 'rgba('+r+','+g+','+b+','+(opacity||0.3)+')';
}

function lightenColor(hex, percent){
  if(!hex) return '#B388FF';
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(function(c){return c+c}).join('');
  var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  r = Math.min(255, Math.floor(r + (255-r)*percent/100));
  g = Math.min(255, Math.floor(g + (255-g)*percent/100));
  b = Math.min(255, Math.floor(b + (255-b)*percent/100));
  return '#'+[r,g,b].map(function(c){return ('0'+c.toString(16)).slice(-2)}).join('');
}

function darkenColor(hex, percent){
  if(!hex) return '#5C35CC';
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(function(c){return c+c}).join('');
  var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  r = Math.max(0, Math.floor(r * (100-percent)/100));
  g = Math.max(0, Math.floor(g * (100-percent)/100));
  b = Math.max(0, Math.floor(b * (100-percent)/100));
  return '#'+[r,g,b].map(function(c){return ('0'+c.toString(16)).slice(-2)}).join('');
}

// 监听主题应用按钮
document.addEventListener('click', function(e){
  if(e.target.id === 'themeApplyBtn'){
    var theme = {
      primary: document.getElementById('themePrimary').value,
      secondary: document.getElementById('themeSecondary').value,
      bg: document.getElementById('themeBg').value,
      card_bg: document.getElementById('themeCardBg').value,
      bg_image: window.pendingThemeBg || ''
    };
    applyTheme(theme);
    saveThemeToServer(theme);
    toast('🎨 主题已应用并保存！');
  }
  if(e.target.id === 'themeResetBtn'){
    window.pendingThemeBg = '';
    var bgWrap = document.getElementById('themeBgPreviewWrap');
    var bgClear = document.getElementById('themeBgClearBtn');
    var bgStatus = document.getElementById('themeBgStatus');
    var bgInput = document.getElementById('themeBgUpload');
    if(bgWrap){bgWrap.style.display='none';}
    if(bgClear){bgClear.style.display='none';}
    if(bgStatus){bgStatus.textContent='';}
    if(bgInput){bgInput.value='';}
    applyTheme(DEFAULT_THEME);
    saveThemeToServer(DEFAULT_THEME);
    toast('↺ 已恢复默认主题');
  }
});
