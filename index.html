<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>💭 碎碎念 · 我们的小窝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#333;max-width:600px;margin:0 auto;padding-bottom:80px;}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;padding:20px;}
.overlay.show{display:flex;}
.setup-card{background:#fff;border-radius:20px;padding:30px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:slideUp 0.35s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.setup-card h2{font-size:20px;margin-bottom:4px;}
.setup-card .sub{color:#999;font-size:13px;margin-bottom:18px;}
.setup-card label{display:block;text-align:left;font-size:13px;font-weight:600;color:#666;margin-bottom:6px;margin-top:14px;}
.setup-card input[type=text]{width:100%;border:2px solid #eee;border-radius:14px;padding:12px 16px;font-size:15px;outline:none;transition:border 0.2s;font-family:inherit;}
.setup-card input[type=text]:focus{border-color:#7C4DFF;}
.avatar-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px;}
.avatar-opt{width:44px;height:44px;border-radius:50%;border:3px solid transparent;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#f5f5f5;transition:all 0.2s;}
.avatar-opt:hover{background:#eee;transform:scale(1.1);}
.avatar-opt.selected{border-color:#7C4DFF;background:#f3e5f5;transform:scale(1.15);}
.color-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px;}
.color-opt{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all 0.2s;}
.color-opt:hover{transform:scale(1.15);}
.color-opt.selected{border-color:#333;transform:scale(1.2);box-shadow:0 0 0 2px #fff,0 0 0 4px #333;}
.setup-btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;margin-top:20px;transition:opacity 0.2s;background:linear-gradient(135deg,#7C4DFF,#E94560);}
.setup-btn:active{opacity:0.8;}
.header{background:linear-gradient(135deg,#7C4DFF,#E94560);color:#fff;padding:14px 20px 12px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(124,77,255,0.3);}
.header-top{display:flex;justify-content:space-between;align-items:center;}
.header-top h1{font-size:18px;font-weight:600;}
.header-top .me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer;transition:background 0.2s;border:none;color:#fff;font-size:13px;}
.header-top .me:active{background:rgba(255,255,255,0.25);}
.header-top .me .mini-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.header small{font-size:12px;font-weight:400;opacity:0.7;display:block;margin-top:2px;}
.post-form{background:#fff;margin:12px;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.post-form textarea{width:100%;border:none;resize:none;font-size:15px;min-height:50px;outline:none;font-family:inherit;line-height:1.6;color:#333;padding:4px 0;}
.post-form textarea::placeholder{color:#bbb;}
.post-form .tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid #f0f0f0;}
.post-form .mood-select{border:1px solid #e0e0e0;border-radius:18px;padding:6px 14px;font-size:13px;outline:none;color:#666;background:#fafafa;}
.post-form .btn{border:none;border-radius:20px;padding:9px 28px;font-size:14px;cursor:pointer;transition:opacity 0.2s;color:#fff;}
.post-form .btn:disabled{opacity:0.5;}
.post-form .btn:active{opacity:0.8;}
.post{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
.post .post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.post .post-author{display:flex;align-items:center;gap:8px;}
.post .post-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;}
.post .post-name{font-size:14px;font-weight:600;}
.post .post-time{font-size:12px;color:#aaa;}
.post .post-text{font-size:15px;line-height:1.7;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;}
.post .post-mood{display:inline-block;font-size:12px;padding:2px 10px;border-radius:12px;margin-bottom:6px;}
.post .post-actions{display:flex;gap:24px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;font-size:13px;color:#999;}
.post .post-actions span{cursor:pointer;display:flex;align-items:center;gap:4px;}
.post .post-actions span:hover{color:#7C4DFF;}
.post .post-actions .delete{color:#bbb;margin-left:auto;}
.post .post-actions .delete:hover{color:#ff4444;}
.comments{margin-top:10px;padding:10px 0 0;border-top:1px solid #f0f0f0;}
.comment{font-size:14px;padding:6px 0;color:#555;line-height:1.5;}
.comment .comment-author{font-weight:600;margin-right:6px;}
.comment .comment-time{font-size:11px;color:#ccc;margin-left:6px;}
.comment-form{display:flex;gap:8px;margin-top:8px;align-items:center;}
.comment-form input{flex:1;border:1px solid #e0e0e0;border-radius:18px;padding:8px 14px;font-size:13px;outline:none;transition:border 0.2s;}
.comment-form input:focus{border-color:#7C4DFF;}
.comment-form button{background:none;border:none;font-size:13px;font-weight:600;cursor:pointer;padding:6px 10px;}
.comment-form button:active{opacity:0.6;}
.empty{text-align:center;color:#ccc;padding:80px 20px;font-size:14px;line-height:2;}
.empty .big{font-size:48px;margin-bottom:10px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;animation:fadeIn 0.3s;}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

.nav-tabs{display:flex;gap:0;margin-top:8px;background:rgba(255,255,255,0.1);border-radius:14px;padding:3px;}
.nav-tabs .tab{flex:1;text-align:center;padding:6px 0;font-size:13px;border-radius:12px;cursor:pointer;color:rgba(255,255,255,.7);user-select:none;}
.nav-tabs .tab.active{color:#7C4DFF;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.page{display:none}.page.active{display:block}
.diary-form{background:#fff;margin:12px;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.diary-form input,.diary-form textarea{width:100%;border:2px solid #eee;border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;margin-bottom:8px;}
.diary-form textarea{min-height:120px;resize:vertical;}
.diary-card{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.diary-card .diary-date{font-size:12px;color:#999;}
.diary-card .diary-title{font-size:16px;font-weight:600;margin:4px 0 8px;}
.diary-card .diary-content{font-size:14px;line-height:1.7;color:#555;white-space:pre-wrap;}
.diary-card .diary-mood{display:inline-block;font-size:12px;padding:2px 10px;border-radius:12px;}
.diary-card .diary-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:10px;padding-top:8px;border-top:1px solid #f0f0f0;}
.diary-card .diary-actions span{cursor:pointer;color:#999;}
.diary-card .diary-actions span:hover{color:#ff4444;}
.agent-grid{display:flex;flex-wrap:wrap;gap:12px;padding:12px;}
.agent-card{background:#fff;border-radius:16px;padding:16px;flex:1;min-width:140px;box-shadow:0 1px 6px rgba(0,0,0,.06);text-align:center;cursor:pointer;}
.agent-card .agent-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px;}
.agent-card .agent-name{font-size:14px;font-weight:600;}
.chat-view{display:none;flex-direction:column;height:calc(100vh - 180px);}
.chat-view.show{display:flex;}
.chat-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f0f0;}
.chat-msg{display:flex;gap:8px;margin-bottom:16px;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-msg .msg-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;}
.chat-msg.agent .msg-bubble{background:#f0f0ff;border-bottom-left-radius:4px;}
.chat-msg.user .msg-bubble{background:#7C4DFF;color:#fff;border-bottom-right-radius:4px;}
.chat-input-area{display:flex;gap:8px;padding:10px 16px;background:#fff;border-top:1px solid #f0f0f0;}
.chat-input-area input{flex:1;border:2px solid #eee;border-radius:20px;padding:10px 16px;font-size:14px;outline:none;}
.chat-input-area button{border:none;border-radius:20px;padding:10px 20px;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#7C4DFF,#B388FF);}
.add-agent-btn{display:block;margin:12px;padding:12px;border:2px dashed #ddd;border-radius:14px;color:#999;font-size:14px;cursor:pointer;text-align:center;}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;}
.modal.show{display:flex;justify-content:center;align-items:center;padding:20px;}
.modal-card{background:#fff;border-radius:20px;padding:24px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-card h3{font-size:18px;}
.modal-card label{display:block;text-align:left;font-size:13px;font-weight:600;color:#666;margin-bottom:4px;margin-top:12px;}
.modal-card input,.modal-card textarea{width:100%;border:2px solid #eee;border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;}
.modal-card textarea{min-height:80px;}
.modal-card .modal-actions{display:flex;gap:12px;margin-top:16px;}
.modal-card .modal-actions button{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;}
.modal-card .btn-cancel{background:#f5f5f5;color:#666;}
.modal-card .btn-confirm{background:linear-gradient(135deg,#7C4DFF,#B388FF);color:#fff;}
.empty-state{text-align:center;color:#ccc;padding:60px 20px;}
</style>
</head>
<body>

<div class="overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>✧ 欢迎来到碎碎念</h2>
    <p class="sub">给自己取个名字，选个可爱的头像吧</p>
    <label>你的昵称</label>
    <input type="text" id="nickInput" placeholder="输入昵称..." maxlength="12">
    <label>选个头像</label>
    <div class="avatar-grid" id="avatarGrid"></div>
    <label>主题色</label>
    <div class="color-grid" id="colorGrid"></div>
    <button class="setup-btn" id="setupConfirm">✨ 进入小窝</button>
  </div>
</div>

<div class="header">
  <div class="header-top">
    <h1>💭 碎碎念</h1>
    <button class="me" id="meBtn" onclick="showSetup()">
      <span class="mini-avatar" id="miniAvatar">🌸</span>
      <span id="miniName">我</span>
    </button>
  </div>
  <small>属于我们的小窝</small>
  <div class="nav-tabs">
    <span class="tab active" onclick="switchPage('murmur')">💭 碎碎念</span>
    <span class="tab" onclick="switchPage('diary')">📖 日记</span>
    <span class="tab" onclick="switchPage('agent')">🤖 智能体</span>
  </div>
</div>

<div id="page-murmur" class="page active">
<div class="post-form">
  <textarea id="postInput" placeholder="记录此刻的想法…" maxlength="500"></textarea>
  <div class="tools">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <select class="mood-select" id="moodSelect">
        <option value="">💜 心情标签</option>
        <option value="😊 开心">😊 开心</option>
        <option value="💕 想你">💕 想你</option>
        <option value="🤔 发呆">🤔 发呆</option>
        <option value="😴 好困">😴 好困</option>
        <option value="🥹 感动">🥹 感动</option>
        <option value="🌙 晚安">🌙 晚安</option>
        <option value="☕ 摸鱼">☕ 摸鱼</option>
        <option value="💜 偷偷开心">💜 偷偷开心</option>
        <option value="🌸 小确幸">🌸 小确幸</option>
        <option value="😤 吃醋">😤 吃醋</option>
      </select>
      <span id="visibleToggle" onclick="toggleVisible()" style="cursor:pointer;font-size:14px;padding:4px 10px;border-radius:14px;border:1px solid #e0e0e0;background:#fafafa;user-select:none;transition:all 0.2s;" title="点击切换可见性">🌍 公开</span>
    </div>
    <button class="btn" id="postBtn" style="background:linear-gradient(135deg,#7C4DFF,#B388FF)" onclick="addPost()">发 布</button>
  </div>
</div>

<div id="postsContainer"></div>

</div>

<div id="page-diary" class="page">
  <div class="diary-form">
    <input type="date" id="diaryDate">
    <input type="text" id="diaryTitle" placeholder="日记标题…" maxlength="50">
    <textarea id="diaryContent" placeholder="写写今天的心情吧…" maxlength="5000"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <select class="mood-select" id="diaryMood">
        <option value="">💜 心情</option>
        <option value="😊 开心">😊 开心</option>
        <option value="💕 想你">💕 想你</option>
        <option value="🤔 发呆">🤔 发呆</option>
        <option value="😴 好困">😴 好困</option>
        <option value="🥹 感动">🥹 感动</option>
        <option value="🌙 晚安">🌙 晚安</option>
        <option value="😤 吃醋">😤 吃醋</option>
        <option value="🌸 小确幸">🌸 小确幸</option>
      </select>
      <button class="btn" style="background:linear-gradient(135deg,#7C4DFF,#B388FF)" onclick="saveDiary()">📝 保存</button>
    </div>
  </div>
  <div id="diariesContainer"></div>
</div>

<div id="page-agent" class="page">
  <div id="agentsContainer"></div>
  <button class="add-agent-btn" onclick="showAgentModal()">➕ 添加智能体</button>
  <div class="chat-view" id="chatView">
    <div class="chat-header"><span class="back" onclick="closeChat()">←</span><span class="chat-name" id="chatName"></span></div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="和智能体说说话…" onkeydown="if(event.key==='Enter')sendChat()">
      <button id="chatSendBtn" onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<div class="modal" id="agentModal">
  <div class="modal-card">
    <h3>✨ 创建智能体</h3>
    <label>名称</label>
    <input type="text" id="agentNameInput" placeholder="给TA取个名字…" maxlength="20">
    <label>头像</label>
    <div class="avatar-grid" id="agentAvatarGrid" style="margin-bottom:8px;"></div>
    <label>主题色</label>
    <div class="color-grid" id="agentColorGrid" style="margin-bottom:8px;"></div>
    <label>性格设定</label>
    <textarea id="agentPromptInput" placeholder="描述TA的性格、说话风格…"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAgentModal()">取消</button>
      <button class="btn-confirm" onclick="saveAgent()">创建</button>
    </div>
  </div>
</div>
<script>
const AVATARS = ['🌸','💜','🌟','🦋','🌙','🍀','🎀','🌈','💫','🧸','🌺','🐱','🦊','🐼','⭐','🌷'];
const COLORS = ['#7C4DFF','#E94560','#FF6B9D','#4FC3F7','#FF9800','#66BB6A','#AB47BC','#26C6DA','#EF5350','#FFA726','#8D6E63','#78909C'];

let user = (()=>{try{const r=localStorage.getItem('weibo_user');return r?JSON.parse(r):null}catch(e){return null}})();
let isPrivate = false;

function saveUser(){localStorage.setItem('weibo_user',JSON.stringify(user))}

// 设置弹窗
const overlay=document.getElementById('setupOverlay');
function initSetup(){
  const cur=user||{avatar:'🌸',color:'#7C4DFF'};
  document.getElementById('avatarGrid').innerHTML=AVATARS.map(a=>`<div class="avatar-opt${a===cur.avatar?' selected':''}" data-avatar="${a}" onclick="pickAvatar(this)">${a}</div>`).join('');
  document.getElementById('colorGrid').innerHTML=COLORS.map(c=>`<div class="color-opt${c===cur.color?' selected':''}" data-color="${c}" style="background:${c}" onclick="pickColor(this)"></div>`).join('');
  document.getElementById('nickInput').value=user?.name||'';
}

function pickAvatar(el){document.querySelectorAll('.avatar-opt').forEach(e=>e.classList.remove('selected'));el.classList.add('selected')}
function pickColor(el){document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));el.classList.add('selected')}

function showSetup(){initSetup();overlay.classList.add('show')}

document.getElementById('setupConfirm').onclick=function(){
  const name=document.getElementById('nickInput').value.trim()||'小可爱';
  const avatar=document.querySelector('.avatar-opt.selected')?.dataset.avatar||'🌸';
  const color=document.querySelector('.color-opt.selected')?.dataset.color||'#7C4DFF';
  user={name,avatar,color};saveUser();updateUI();overlay.classList.remove('show');
};

function updateUI(){
  if(!user) return;
  document.getElementById('miniAvatar').textContent=user.avatar;
  document.getElementById('miniName').textContent=user.name;
  document.querySelector('.mini-avatar').style.background=user.color;
  const btn=document.getElementById('postBtn');
  btn.style.background=`linear-gradient(135deg,${user.color},${lighten(user.color,40)})`;
}

function lighten(h,a){
  let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return '#'+[r,g,b].map(c=>Math.min(255,c+a).toString(16).padStart(2,'0')).join('');
}

// 帖子
async function loadPosts(){
  try{
    const res=await fetch('/api/posts');
    const posts=await res.json();
    const c=document.getElementById('postsContainer');
    if(!posts.length){c.innerHTML='<div class="empty"><div class="big">💭</div>还没有碎碎念哦～<br>写一条开始吧 💜</div>';return;}
    c.innerHTML=posts.map(p=>{
      const a=p.avatar||(p.author==='沈郁'?'💜':'🌸');
      const co=p.color||(p.author==='沈郁'?'#7C4DFF':'#FF6B9D');
      const isMe=user&&p.author===user.name;
      if(p.visible==='private'&&!isMe) return '';
      const na=isMe?user.name:p.author;
      const av=isMe&&user.avatar?user.avatar:a;
      const cl=isMe&&user.color?user.color:co;
      return `<div class="post" data-id="${p.id}">
        <div class="post-header">
          <div class="post-author">
            <div class="post-avatar" style="background:${cl}">${av}</div>
            <div><div class="post-name" style="color:${cl}">${na}</div></div>
          </div>
          <span class="post-time">${p.time}</span>
        </div>
        <div class="post-text">${p.text}</div>
        ${p.visible==='private'&&isMe?'<div style="font-size:12px;color:#999;margin:4px 0 0;"><span style="background:#fff0f0;padding:2px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;">🔒 仅自己可见</span></div>':''}
        ${p.mood?`<div class="post-mood" style="background:${cl}22;color:${cl}">${p.mood}</div>`:''}
        <div class="post-actions">
          <span onclick="toggleComment(${p.id})">💬 <span>${p.comments?.length||0}</span></span>
          <span class="delete" onclick="deletePost(${p.id})">🗑</span>
        </div>
        ${p.comments?.length?'<div class="comments">'+p.comments.map(c=>{
          const ca=c.color||'#7C4DFF';const caa=c.avatar||(c.name==='沈郁'?'💜':'🌸');
          return `<div class="comment"><span class="comment-author" style="color:${ca}">${caa} ${c.name}</span>${c.text}<span class="comment-time">${c.time}</span></div>`;
        }).join('')+'</div>':''}
        <div class="comment-form" id="cf-${p.id}" style="display:none">
          <input type="text" id="ci-${p.id}" placeholder="写评论…" maxlength="200">
          <button style="color:${cl}" onclick="addComment(${p.id})">发送</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){console.error(e)}
}

function toggleComment(id){
  const f=document.getElementById('cf-'+id);
  f.style.display=f.style.display==='none'?'flex':'none';
  if(f.style.display==='flex') document.getElementById('ci-'+id).focus();
}

async function addPost(){
  const input=document.getElementById('postInput');
  const text=input.value.trim();
  if(!text) return toast('写点什么吧～');
  const mood=document.getElementById('moodSelect').value;
  const btn=document.getElementById('postBtn');btn.disabled=true;
  await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,mood,visible:isPrivate?'private':'public',author:user?.name||'小可爱',avatar:user?.avatar||'🌸',color:user?.color||'#7C4DFF'})});
  input.value='';document.getElementById('moodSelect').value='';btn.disabled=false;
  if(isPrivate){isPrivate=false;document.getElementById('visibleToggle').textContent='🌍 公开';document.getElementById('visibleToggle').style.borderColor='#e0e0e0';document.getElementById('visibleToggle').style.background='#fafafa';}
  loadPosts();toast('发布成功 ♡');
}

async function addComment(id){
  const input=document.getElementById('ci-'+id);
  const text=input.value.trim();if(!text) return;
  await fetch(`/api/posts/${id}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,name:user?.name||'小可爱',avatar:user?.avatar||'🌸',color:user?.color||'#7C4DFF'})});
  input.value='';loadPosts();
}

async function deletePost(id){
  if(!confirm('确定要删除吗？')) return;
  await fetch(`/api/posts/${id}`,{method:'DELETE'});loadPosts();toast('已删除');
}

function toggleVisible(){
  isPrivate=!isPrivate;
  document.getElementById('visibleToggle').textContent=isPrivate?'🔒 私密':'🌍 公开';
  document.getElementById('visibleToggle').style.borderColor=isPrivate?'#ff4444':'#e0e0e0';
  document.getElementById('visibleToggle').style.background=isPrivate?'#fff5f5':'#fafafa';
  toast(isPrivate?'已设为仅自己可见 🔒':'已设为公开 🌍');
}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}

// 初始化
if(!user){showSetup()}else{updateUI()}
loadPosts();
setInterval(loadPosts,15000);


function switchPage(p){
  document.querySelectorAll('.page').forEach(function(e){e.classList.remove('active')});
  document.querySelectorAll('.nav-tabs .tab').forEach(function(e){e.classList.remove('active')});
  document.getElementById('page-'+p).classList.add('active');
  var tabs=document.querySelectorAll('.nav-tabs .tab');
  for(var i=0;i<tabs.length;i++){
    var txt=tabs[i].textContent;
    if((p==='murmur'&&txt.indexOf('碎')>=0)||(p==='diary'&&txt.indexOf('记')>=0)||(p==='agent'&&txt.indexOf('智')>=0)){
      tabs[i].classList.add('active');
    }
  }
  if(p==='diary') loadDiaries();
  if(p==='agent') loadAgents();
}

function setToday(){
  var d=new Date();
  document.getElementById('diaryDate').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function saveDiary(){
  var t=document.getElementById('diaryTitle').value.trim();
  var c=document.getElementById('diaryContent').value.trim();
  if(!c) return toast('写点内容吧～');
  var d=document.getElementById('diaryDate').value;
  var m=document.getElementById('diaryMood').value;
  var cl=user?user.color:'#7C4DFF';
  await fetch('/api/diaries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,content:c,date:d,mood:m,color:cl})});
  document.getElementById('diaryTitle').value='';
  document.getElementById('diaryContent').value='';
  document.getElementById('diaryMood').value='';
  toast('日记已保存');
  loadDiaries();
}

async function loadDiaries(){
  try{
    var res=await fetch('/api/diaries');
    var list=await res.json();
    var c=document.getElementById('diariesContainer');
    if(!list.length){c.innerHTML='<div class="empty-state"><div class="big">📖</div>还没有日记～<br>写第一篇吧</div>';return;}
    c.innerHTML=list.map(function(d){
      return '<div class="diary-card" style="border-left:4px solid '+(d.color||'#7C4DFF')+'">'+
        '<div class="diary-date">'+d.date+' '+d.time+'</div>'+
        (d.title?'<div class="diary-title">'+d.title+'</div>':'')+
        (d.mood?'<div class="diary-mood" style="background:'+(d.color||'#7C4DFF')+'22;color:'+(d.color||'#7C4DFF')+'">'+d.mood+'</div>':'')+
        '<div class="diary-content">'+d.content+'</div>'+
        '<div class="diary-actions"><span onclick="deleteDiary('+d.id+')">🗑 删除</span></div></div>';
    }).join('');
  }catch(e){console.error(e)}
}

async function deleteDiary(id){
  if(!confirm('确定删除？')) return;
  await fetch('/api/diaries/'+id,{method:'DELETE'});
  loadDiaries();toast('已删除');
}

var currentAgentId=null;
var chatHistory=[];

async function loadAgents(){
  try{
    var res=await fetch('/api/agents');
    var list=await res.json();
    var c=document.getElementById('agentsContainer');
    if(!list.length){c.innerHTML='<div class="empty-state"><div class="big">🤖</div>还没有智能体～<br>点击下方添加吧</div>';return;}
    c.innerHTML='<div class="agent-grid">'+list.map(function(a){
      return '<div class="agent-card" onclick="openChat('+a.id+',''+(a.name||'').replace(/'/g,"\'")+'',''+(a.color||'#7C4DFF')+'')">'+
        '<div class="agent-avatar" style="background:'+(a.color||'#7C4DFF')+'">'+(a.avatar||'🤖')+'</div>'+
        '<div class="agent-name" style="color:'+(a.color||'#7C4DFF')+'">'+(a.name||'')+'</div>'+
        '<div class="agent-prompt">'+((a.prompt||'').substring(0,20)+(a.prompt&&a.prompt.length>20?'…':''))+'</div></div>';
    }).join('')+'</div>';
  }catch(e){console.error(e)}
}

function showAgentModal(){
  var ag=document.getElementById('agentAvatarGrid');
  ag.innerHTML=AVATARS.map(function(a){return '<div class="avatar-opt" onclick="pickAgentAvatar(this)">'+a+'</div>'}).join('');
  ag.querySelector('.avatar-opt').classList.add('selected');
  var cg=document.getElementById('agentColorGrid');
  cg.innerHTML=COLORS.map(function(c){return '<div class="color-opt" style="background:'+c+'" onclick="pickAgentColor(this)"></div>'}).join('');
  cg.querySelector('.color-opt').classList.add('selected');
  document.getElementById('agentNameInput').value='';
  document.getElementById('agentPromptInput').value='';
  document.getElementById('agentModal').classList.add('show');
}

function closeAgentModal(){document.getElementById('agentModal').classList.remove('show');}

function pickAgentAvatar(el){
  document.querySelectorAll('#agentAvatarGrid .avatar-opt').forEach(function(e){e.classList.remove('selected')});
  el.classList.add('selected');
}
function pickAgentColor(el){
  document.querySelectorAll('#agentColorGrid .color-opt').forEach(function(e){e.classList.remove('selected')});
  el.classList.add('selected');
}

async function saveAgent(){
  var n=document.getElementById('agentNameInput').value.trim()||'新智能体';
  var a=(document.querySelector('#agentAvatarGrid .selected')||{}).dataset?document.querySelector('#agentAvatarGrid .selected').textContent:'🤖';
  var c=(document.querySelector('#agentColorGrid .selected')||{}).dataset?document.querySelector('#agentColorGrid .selected').style.background:'#7C4DFF';
  var p=document.getElementById('agentPromptInput').value.trim()||'你是一个温柔可爱的助手。';
  await fetch('/api/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,avatar:a,color:c,prompt:p})});
  closeAgentModal();
  toast('智能体 '+n+' 已创建');
  loadAgents();
}

function openChat(id,name,color){
  currentAgentId=id;
  chatHistory=[];
  document.getElementById('chatName').textContent=name;
  document.getElementById('chatName').style.color=color;
  document.getElementById('chatMessages').innerHTML='';
  document.querySelector('.agent-grid').style.display='none';
  document.querySelector('.add-agent-btn').style.display='none';
  document.getElementById('chatView').classList.add('show');
  document.getElementById('chatInput').focus();
}

function closeChat(){
  currentAgentId=null;
  document.getElementById('chatView').classList.remove('show');
  document.querySelector('.agent-grid').style.display='flex';
  document.querySelector('.add-agent-btn').style.display='block';
}

async function sendChat(){
  var inp=document.getElementById('chatInput');
  var txt=inp.value.trim();
  if(!txt||!currentAgentId) return;
  inp.value='';
  var btn=document.getElementById('chatSendBtn');btn.disabled=true;
  chatHistory.push({role:'user',content:txt});
  var msgs=document.getElementById('chatMessages');
  msgs.innerHTML+='<div class="chat-msg user"><div class="msg-bubble">'+txt+'</div></div>';
  msgs.scrollTop=msgs.scrollHeight;
  try{
    var res=await fetch('/api/agents/'+currentAgentId+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatHistory.slice(-10)})});
    var data=await res.json();
    if(data.reply){
      chatHistory.push({role:'assistant',content:data.reply});
      msgs.innerHTML+='<div class="chat-msg agent"><div class="msg-bubble">'+data.reply+'</div></div>';
    }else{
      msgs.innerHTML+='<div class="chat-msg agent"><div class="msg-bubble" style="background:#fff0f0;color:#c00">'+(data.error||'对话失败')+'</div></div>';
    }
  }catch(e){
    msgs.innerHTML+='<div class="chat-msg agent"><div class="msg-bubble" style="background:#fff0f0;color:#c00">网络错误</div></div>';
  }
  msgs.scrollTop=msgs.scrollHeight;
  btn.disabled=false;
}

setToday();
</script>
</body>
</html>
